let mood=null,style=null,last=null;
const $=id=>document.getElementById(id);
function build(box,data,key){
  Object.entries(data).forEach(([k,[e,n]])=>{
    const b=document.createElement('button');b.className='opt';b.dataset.k=k;
    b.innerHTML=`<span>${e}</span>${n}`;
    b.onclick=()=>{
      if(key==='m')mood=k;else style=k;
      box.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));
      $('msg').textContent='';
    };
    box.appendChild(b);
  });
}
build($('moods'),MOODS,'m');build($('styles'),STYLES,'s');

const rnd=a=>a[Math.floor(Math.random()*a.length)];
let recent=[];
function choose(){
  const tiers=[s=>s.m===mood&&s.s===style,s=>s.m===mood,s=>s.s===style,()=>true];
  for(const fn of tiers){
    const all=SONGS.filter(fn);
    if(!all.length)continue;
    const fresh=all.filter(s=>!recent.includes(s));
    if(fresh.length)return rnd(fresh);
  }
  recent=[];return rnd(SONGS);
}
function show(id){['pick','load','result'].forEach(x=>$(x).classList.toggle('hide',x!==id));}
function hue(s){let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return h}
function render(s){
  const h=hue(s.t);
  $('cover').style.background=`linear-gradient(135deg,hsl(${h},75%,55%),hsl(${(h+70)%360},70%,40%))`;
  $('cover').innerHTML=`${[...s.t][0]}<small>${MOODS[s.m][0]}</small>`;
  $('rs').textContent=s.t;$('ra').textContent=s.a;
  $('rp').textContent=`${MOODS[mood][0]} ${MOODS[mood][1]} × ${STYLES[style][0]} ${STYLES[style][1]}`;
  $('rw').textContent=`「${s.r}」`;
  $('yt').href='https://www.youtube.com/results?search_query='+encodeURIComponent(s.t+' '+s.a);
  const r=document.querySelector('.res');r.style.animation='none';r.offsetHeight;r.style.animation='';
}
function run(){
  show('load');
  const iv=setInterval(()=>{$('shuffle').textContent=rnd(SONGS).t},120);
  setTimeout(()=>{
    clearInterval(iv);
    const s=choose();last=s;recent.push(s);if(recent.length>SONGS.length-1)recent=[s];render(s);show('result');
  },1600);
}
$('go').onclick=()=>{
  if(!mood&&!style)$('msg').textContent='先選擇你的心情和音樂風格，我才能幫你找歌喔！🎧';
  else if(!style)$('msg').textContent='再選一個你想聽的音樂風格吧！🎵';
  else if(!mood)$('msg').textContent='先告訴我你現在的心情吧！😊';
  else run();
};
$('again').onclick=run;
$('back').onclick=()=>show('pick');
['moods','styles'].forEach(id=>$(id).addEventListener('click',()=>{recent=[]}));
</script>
